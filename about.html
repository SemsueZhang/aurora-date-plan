<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CupidLink · 关于项目</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            warm: {
              bg: '#fff7f2',
              card: '#ffeede',
              primary: '#e88c78',
              text: '#6b4842'
            }
          },
          fontFamily: { soft: ['system-ui', 'sans-serif'] }
        }
      }
    }
  </script>
  <style>
    body {
      min-height: 100vh;
      background-color: #fff4ef;
      background-image:
        radial-gradient(1100px 550px at 12% -8%, rgba(255, 201, 176, 0.55) 0%, transparent 55%),
        radial-gradient(1000px 520px at 108% 15%, rgba(255, 186, 213, 0.45) 0%, transparent 55%),
        radial-gradient(950px 600px at 50% 118%, rgba(255, 224, 160, 0.5) 0%, transparent 50%);
      background-attachment: fixed;
    }
    .nav-link{ transition:0.2s; }
    .nav-link:hover{ color:#e88c78; }
  </style>
</head>
<body class="font-soft min-h-screen px-4 py-4 text-warm-text">
<div class="max-w-xl mx-auto">
  <nav class="flex justify-center gap-6 mb-8 text-base">
    <a href="./index.html" class="nav-link">首页</a>
    <a href="./guide.html" class="nav-link">使用指南</a>
    <a href="./about.html" class="nav-link font-medium">关于</a>
  </nav>

  <div class="text-center mb-8">
    <h1 class="text-[clamp(1.6rem,4vw,2rem)] font-semibold mb-2">💘 关于 CupidLink</h1>
  </div>

  <div class="bg-warm-card rounded-2xl p-6 shadow-lg space-y-4">
    <p>
CupidLink 是一个简单的静态网页工具，用来快速生成约会计划清单。
    </p>
    <p>
全部运行在浏览器，无后端，所有数据不会外传。适合情侣之间沟通约会安排。
    </p>
    <hr class="border-warm-primary/30">
    <p>项目开源托管于 GitHub Pages。</p>
    <p>项目名含义：<strong>CupidLink</strong>，Cupid（丘比特）与 Link（连线）的结合，寓意由爱神牵线的浪漫赴约。</p>
  </div>

  <div class="text-center mt-6 text-sm opacity-70">
    <a href="./index.html" class="underline">← 返回首页</a>
  </div>
</div>

</html>
